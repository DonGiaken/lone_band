<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>键盘钢琴 → MIDI</title>
<style>
  :root{
    --bg:#0d1017; --panel:#161b25; --line:#232b39; --ink:#e7edf7; --dim:#8593a8;
    --accent:#5eead4; --rec:#ff5c68; --paper:#fbfaf7;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2434 0%,var(--bg) 60%);
    color:var(--ink);min-height:100vh;padding:26px 18px 40px;
    font:14px/1.5 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:18px;
    user-select:none;-webkit-user-select:none;
  }
  header{text-align:center}
  h1{margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12.5px}
  kbd{background:#202836;border:1px solid #2e3949;border-bottom-width:2px;border-radius:4px;
      padding:0 5px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfd9e8}

  .shell{width:min(1120px,100%);display:flex;flex-direction:column;gap:14px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;background:var(--panel);
       border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  button{
    font:inherit;font-size:13px;color:var(--ink);background:#202a3a;border:1px solid #2f3a4d;
    border-radius:8px;padding:7px 13px;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;
  }
  button:hover:not(:disabled){background:#27334a;border-color:#3d4b63}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06211d;font-weight:600}
  button.primary:hover:not(:disabled){background:#7ff0dd;border-color:#7ff0dd}
  button.rec{background:#2a1620;border-color:#4a2230;color:#ff9aa3}
  button.rec.on{background:var(--rec);border-color:var(--rec);color:#2a0006;font-weight:600}
  .spacer{flex:1 1 auto}
  .field{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px}
  .field input[type=number]{width:62px;font:inherit;font-size:13px;color:var(--ink);background:#0f1420;
    border:1px solid #2f3a4d;border-radius:7px;padding:5px 7px;text-align:right}
  .field input:focus{outline:none;border-color:var(--accent)}
  .meter{display:flex;align-items:center;gap:7px;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:#33405a;transition:background .15s;flex:none}
  .dot.live{background:var(--rec);box-shadow:0 0 0 4px rgba(255,92,104,.15);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  label.check{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;cursor:pointer}
  label.check input{accent-color:#14b8a6;width:14px;height:14px}

  #piano{position:relative;height:200px;width:100%;background:#0a0d14;border:1px solid var(--line);
         border-radius:12px;padding:10px;overflow:hidden}
  .keys{position:relative;height:100%;width:100%}
  .wk,.bk{position:absolute;top:0;border-radius:0 0 6px 6px;cursor:pointer;
          display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
          transition:background .05s}
  .wk{background:linear-gradient(180deg,#f7f8fb 0%,#e2e6ee 100%);border:1px solid #b9c1ce;border-top:none;
      height:100%;color:#7d8798;font:11px ui-monospace,Menlo,monospace;font-weight:600;z-index:1}
  .wk:active,.wk.down{background:linear-gradient(180deg,#a9efe3 0%,#6fd8c8 100%);color:#0c4a44}
  .bk{height:62%;background:linear-gradient(180deg,#2b3444 0%,#121722 100%);border:1px solid #000;z-index:2;
      color:#8b98ad;font:10px ui-monospace,Menlo,monospace;box-shadow:0 3px 6px rgba(0,0,0,.55)}
  .bk:active,.bk.down{background:linear-gradient(180deg,#3b6f68 0%,#24544d 100%);color:#c8fff5}
  .lbl{pointer-events:none;opacity:.8}

  .score-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .score-head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .score-head h2{margin:0;font-size:13px;font-weight:600}
  .score-head .hint{color:var(--dim);font-size:12px}
  .score-head .spacer{flex:1}
  .score-panel button{font-size:12px;padding:5px 11px}
  #score{background:var(--paper);color:#111;min-height:130px;padding:2px 0;overflow-x:auto}
  #score svg{display:block;width:100%;height:auto}
  .empty{padding:48px 16px;text-align:center;color:#9aa3ae;font-size:12.5px}

  footer{width:min(1120px,100%);display:flex;justify-content:space-between;gap:14px;
         color:var(--dim);font-size:11.5px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <h1>键盘钢琴 <span>→</span> MIDI</h1>
  <div class="sub">
    直接打字弹奏 · <kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd><kbd>D</kbd>… 为白键／黑键 ·
    <kbd>Z</kbd>/<kbd>X</kbd> 换八度 · <kbd>空格</kbd> 延音
  </div>
</header>

<div class="shell">
  <div class="bar">
    <button id="recBtn" class="rec">● 录制</button>
    <button id="playBtn" disabled>▶ 试听</button>
    <button id="dlBtn" class="primary" disabled>⬇ 保存 .mid</button>
    <button id="clrBtn" disabled>清空</button>
    <div class="spacer"></div>
    <label class="check"><input id="quant" type="checkbox" checked> 量化到 1/16</label>
    <div class="meter"><span id="dot" class="dot"></span><span id="status">空闲</span></div>
    <div class="field">速度 <input id="bpm" type="number" value="120" min="30" max="300" step="1"> bpm</div>
    <div class="field">八度
      <button id="octDown" style="padding:4px 9px">−</button>
      <span id="oct" style="width:32px;text-align:center;color:var(--ink)">0</span>
      <button id="octUp" style="padding:4px 9px">+</button>
    </div>
  </div>

  <div id="piano"><div class="keys" id="keys"></div></div>

  <div class="score-panel">
    <div class="score-head">
      <h2>五线谱</h2>
      <span class="hint" id="scoreHint">录制后自动生成</span>
      <span class="spacer"></span>
      <button id="svgBtn" disabled>保存五线谱 (SVG)</button>
    </div>
    <div id="score"><div class="empty">还没有音符 —— 按 ● 录制 开始弹奏</div></div>
  </div>
</div>

<footer>
  <div>录下的音符会按上方速度对齐到网格；五线谱随每次录制结果自动重绘。</div>
  <div>单文件 · 离线可用 · MIDI type 0 / 480 ppq</div>
</footer>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------ audio */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  const voices = new Map();
  let pedal = false;

  const noteFreq = midi => 440 * Math.pow(2, (midi - 69) / 12);

  function startVoice(midi, vel) {
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    stopVoice(midi, true);

    const t = ctx.currentTime, f = noteFreq(midi);
    const amp = Math.pow(vel / 127, 1.7) * 0.55;

    const out = ctx.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp), t + 0.007);
    out.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp * 0.28), t + 0.75);

    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(Math.min(14000, f * 9), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(420, f * 2.2), t + 0.55);
    lp.Q.value = 0.7;

    const oscs = [
      { type: "triangle", mul: 1,    gain: 1 },
      { type: "sine",     mul: 2.01, gain: 0.22 },
      { type: "sine",     mul: 3.0,  gain: 0.07 }
    ].map(p => {
      const o = ctx.createOscillator();
      o.type = p.type;
      o.frequency.value = f * p.mul;
      o.detune.value = (Math.random() - 0.5) * 4;
      const g = ctx.createGain();
      g.gain.value = p.gain;
      o.connect(g).connect(lp);
      o.start(t);
      return o;
    });

    lp.connect(out).connect(ctx.destination);
    voices.set(midi, { out, oscs });
  }

  function stopVoice(midi, immediate) {
    const v = voices.get(midi);
    if (!v) return;
    voices.delete(midi);
    const t = ctx.currentTime;
    const rel = immediate ? 0.03 : (pedal ? 1.6 : 0.25);
    v.out.gain.cancelScheduledValues(t);
    v.out.gain.setValueAtTime(Math.max(0.0002, v.out.gain.value), t);
    v.out.gain.exponentialRampToValueAtTime(0.0001, t + rel);
    v.oscs.forEach(o => { try { o.stop(t + rel + 0.05); } catch (e) {} });
  }

  /* --------------------------------------------------------------- midi file */
  function vlq(n) {
    const b = [n & 0x7f];
    n = Math.floor(n / 128);
    while (n > 0) { b.unshift((n & 0x7f) | 0x80); n = Math.floor(n / 128); }
    return b;
  }
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];

  function buildMidi(events, bpm, ppq) {
    const track = [];
    const tempo = Math.round(60000000 / bpm);
    track.push(0, 0xff, 0x51, 0x03, (tempo >> 16) & 255, (tempo >> 8) & 255, tempo & 255);
    const ev = events.slice().sort((a, b) =>
      a.tick - b.tick || ((a.type === "off" ? 0 : 1) - (b.type === "off" ? 0 : 1)));
    let last = 0;
    for (const e of ev) {
      track.push(...vlq(Math.max(0, e.tick - last)));
      last = e.tick;
      const note = e.note & 127;
      if (e.type === "on") track.push(0x90, note, Math.max(1, Math.min(127, e.vel || 100)));
      else track.push(0x80, note, 0);
    }
    track.push(0, 0xff, 0x2f, 0x00);
    const head = [77, 84, 104, 100, 0, 0, 0, 6, 0, 0, 0, 1, (ppq >> 8) & 255, ppq & 255];
    return new Uint8Array([...head, 77, 84, 114, 107, ...u32(track.length), ...track]);
  }

  /* ==SCORE-START== */
  /* 纯函数：把和弦序列排成一页五线谱 SVG（不依赖 DOM，可在浏览器外单测） */
  function scoreSVG(chords, opt) {
    opt = opt || {};
    const SP = 10;                            // 谱线间距
    const GRID = opt.grid || 120;             // 十六分音符 = 120 ticks
    const TPB = opt.ticksPerBar || 1920;      // 4/4 一小节
    const W = opt.width || 1080;
    const PADL = 50, PADR = 26, PADT = 82, PADB = 40;
    const SYS = 200;
    if (!chords || !chords.length) return "";

    const LET = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];        // 音级字母（黑键取下方白键）
    const IS_BLACK = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
    const dia = m => 7 * (Math.floor(m / 12) - 1) + LET[m % 12];
    const TREB_REF = dia(64);                                  // 高音谱表底线 E4
    const BASS_REF = dia(43);                                  // 低音谱表底线 G2
    const staffOf = midi => (midi >= 60 ? "treble" : "bass");

    const INK = "#15181d";
    const p = [];
    const line = (x1, y1, x2, y2, w) =>
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="${w || 1}"/>`;

    const head = (x, y, kind) => {
      const whole = kind === "whole";
      const rx = whole ? 8.4 : 6.5, ry = whole ? 5.1 : 4.9;
      const fill = (kind === "half" || whole) ? "none" : INK;
      return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(-19 ${x} ${y})"
                fill="${fill}" stroke="${INK}" stroke-width="${fill === 'none' ? 1.7 : 0}"/>`;
    };

    /* 休止符（自绘：系统音乐符号字体常缺这几个字形） */
    function rest(kind, x, y) {
      if (kind === "whole")
        return `<rect x="${x - 6}" y="${y + 1}" width="12" height="4.6" fill="${INK}"/>`;
      if (kind === "half")
        return `<rect x="${x - 6}" y="${y - 5.6}" width="12" height="4.6" fill="${INK}"/>`;
      if (kind === "quarter")
        return `<path d="M ${x + 3} ${y - 13.5} L ${x - 2.2} ${y - 6.6} L ${x + 2.4} ${y - 4} L ${x - 1.6} ${y + 3.6}"
                  fill="none" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;

      const dots = kind === "16th" ? 2 : 1;
      let g = `<path d="M ${x + 2.6} ${y - 11.4} C ${x + 6.4} ${y - 8.4} ${x + 5.6} ${y - 3} ${x + 2.6} ${y + 2}"
                fill="none" stroke="${INK}" stroke-width="2.7" stroke-linecap="round"/>`;
      for (let i = 0; i < dots; i++)
        g = `<circle cx="${x + 2 + i * 0.9}" cy="${y - 10.6 + i * 4.5}" r="2.4" fill="${INK}"/>` + g;
      return g;
    }

    /* 升／还原号（笔画绘制） */
    function accidental(kind, x, y) {
      const s = 9;
      if (kind === "sharp") {
        return line(x - 2.7, y - s, x - 2.7, y + s + 1.5, 1.4) +
               line(x + 2.6, y - s - 1.5, x + 2.6, y + s, 1.4) +
               line(x - 5.6, y - 3.2, x + 5.4, y - 5.0, 2.2) +
               line(x - 5.6, y + 3.4, x + 5.4, y + 1.6, 2.2);
      }
      return line(x - 3.4, y - s, x - 3.4, y + s, 1.6) +
             line(x + 3.4, y - s, x + 3.4, y + s, 1.6) +
             line(x - 3.4, y - 3.4, x + 3.4, y - 4.6, 2.1) +
             line(x - 3.4, y + 3.4, x + 3.4, y + 2.2, 2.1);
    }

    /* ---- 切小节 + 用休止符填空白 */
    const decompose = (len, at) => {
      const out = [], sizes = [16 * GRID, 8 * GRID, 4 * GRID, 2 * GRID, GRID];
      let left = len, t = at;
      while (left > 0) {
        const s = sizes.find(x => x <= left) || GRID;
        out.push({ tick: t, dur: s });
        t += s; left -= s;
      }
      return out;
    };

    const endTick = Math.max(...chords.map(c => c.tick + c.dur));
    const nBars = Math.max(1, Math.ceil(endTick / TPB));
    const bars = [];
    for (let b = 0; b < nBars; b++) {
      const s = b * TPB, e = s + TPB;
      const items = chords
        .filter(c => c.tick >= s && c.tick < e)
        .map(c => ({ tick: c.tick, dur: Math.min(c.dur, e - c.tick), notes: c.notes.slice().sort((x, y) => x - y) }))
        .sort((a, b2) => a.tick - b2.tick);
      const mkRests = staff => {
        const its = items.filter(it => it.notes.some(n => (staff === "treble" ? n >= 60 : n < 60)));
        const out = [];
        let cur = s;
        its.forEach(it => {
          if (it.tick > cur) out.push(...decompose(it.tick - cur, cur));
          cur = Math.max(cur, it.tick + it.dur);
        });
        if (cur < e) out.push(...decompose(e - cur, cur));
        return out;
      };
      const restT = mkRests("treble"), restB = mkRests("bass");
      const pos = new Set([...items.map(i => i.tick), ...restT.map(r => r.tick)]);
      const slots = Math.min(16, Math.max(1, pos.size));
      // 相邻事件的最小水平间距 → 反推小节所需宽度
      let need = 24 * (slots - 1);
      for (let i = 1; i < items.length; i++) {
        const d = items[i].tick - items[i - 1].tick;
        if (d <= 0) continue;
        const acc = items[i].notes.some(n => IS_BLACK[n % 12]);
        const gap = (items[i].dur <= GRID ? 18 : items[i].dur <= 2 * GRID ? 21
                    : items[i].dur <= 4 * GRID ? 27 : 34) + (acc ? 10 : 0);
        need = Math.max(need, gap * TPB / d);
      }
      bars.push({ start: s, items, restT, restB, w: Math.max(158, Math.min(620, 52 + need)) });
    }

    /* ---- 折行 */
    const INDENT = 92;
    const rows = [];
    let row = null;
    bars.forEach(bar => {
      if (!row || row.used + bar.w > W - PADR - row.musicX) {
        row = { bars: [], used: 0, musicX: PADL + INDENT };
        rows.push(row);
      }
      bar.x = row.musicX + row.used;
      row.used += bar.w;
      row.bars.push(bar);
    });
    rows.forEach(r => {
      const avail = W - PADR - r.musicX;
      const s2 = Math.min(2.6, avail / r.used);
      r.bars.forEach(b => { b.w = b.w * s2; });
      let x = r.musicX;
      r.bars.forEach(b => { b.x = x; x += b.w; });
      r.used = x - r.musicX;
    });

    /* ---- 逐行排版 */
    rows.forEach((r, ri) => {
      const y = PADT + ri * SYS;
      const trebBot = y + 50, bassTop = y + 102, bassBot = y + 142;
      const right = r.musicX + r.used;

      for (let i = 0; i < 5; i++) {
        p.push(line(PADL, trebBot - i * SP, right, trebBot - i * SP, (i === 0 || i === 4) ? 1.1 : 0.85));
        p.push(line(PADL, bassBot - i * SP, right, bassBot - i * SP, (i === 0 || i === 4) ? 1.1 : 0.85));
      }
      p.push(line(PADL, trebBot - 4 * SP - 3, PADL, bassBot + 3, 1.8));

      const CLEF_FONT = "'Noto Music','Bravura','Apple Symbols','Segoe UI Symbol','DejaVu Sans',serif";
      p.push(`<text x="${PADL + 2}" y="${trebBot - 1.4 * SP}" font-size="${SP * 8.6}" font-family="${CLEF_FONT}"
                fill="${INK}">&#x1D11E;</text>`);
      p.push(`<text x="${PADL + 2}" y="${bassBot - 0.9 * SP}" font-size="${SP * 8.6}" font-family="${CLEF_FONT}"
                fill="${INK}">&#x1D122;</text>`);

      const tsNum = (bx, by) => `<text x="${bx}" y="${by}" font-size="22" font-weight="600"
                font-family="Georgia,serif" fill="${INK}" text-anchor="middle">4</text>`;
      if (ri === 0) {
        p.push(tsNum(PADL + 74, trebBot - 2.2 * SP));
        p.push(tsNum(PADL + 74, trebBot - 0.3 * SP));
        p.push(tsNum(PADL + 74, bassBot - 2.2 * SP));
        p.push(tsNum(PADL + 74, bassBot - 0.3 * SP));
        p.push(`<text x="${PADL}" y="${y - 20}" font-size="12" fill="#5f6875"
                  font-family="'PingFang SC','Microsoft YaHei',sans-serif">速度 ${opt.bpm || 120}</text>`);
      }

      const staffBot = { treble: trebBot, bass: bassBot };
      const staffRef = { treble: TREB_REF, bass: BASS_REF };
      const yOf = (staff, midi) => staffBot[staff] - (dia(midi) - staffRef[staff]) * (SP / 2);

      r.bars.forEach((bar, bi) => {
        if (bi > 0) {
          p.push(line(bar.x, trebBot - 4 * SP, bar.x, trebBot, 0.9));
          p.push(line(bar.x, bassBot - 4 * SP, bar.x, bassBot, 0.9));
        }
        const mx = bar.x, mw = bar.w, inner = 26;
        const xOf = tick => mx + inner + ((tick - bar.start) / TPB) * (mw - inner - 14);

        /* 休止符（每个谱表独立补） */
        const drawRests = (list, staffBotY) => list.forEach(rt => {
          const x = xOf(rt.tick);
          const k = rt.dur >= 16 * GRID ? "whole" : rt.dur >= 8 * GRID ? "half"
                  : rt.dur >= 4 * GRID ? "quarter" : rt.dur >= 2 * GRID ? "eighth" : "16th";
          const ry = k === "whole" ? staffBotY - 3 * SP : staffBotY - 2 * SP;
          p.push(rest(k, x, ry));
        });
        drawRests(bar.restT, trebBot);
        drawRests(bar.restB, bassBot);

        /* 音符 */
        const accState = {};
        bar.items.forEach(it => {
          const x = xOf(it.tick);
          const kind = it.dur >= 16 * GRID ? "whole" : it.dur >= 8 * GRID ? "half"
                     : it.dur >= 4 * GRID ? "quarter" : it.dur >= 2 * GRID ? "eighth" : "16th";

          ["treble", "bass"].forEach(staff => {
            const ns = it.notes.filter(n => staffOf(n) === staff);
            if (!ns.length) return;

            const dias = ns.map(n => dia(n));
            const minDia = Math.min(...dias), maxDia = Math.max(...dias);
            const ys = ns.map(n => yOf(staff, n));
            const yTop = Math.min(...ys), yBot = Math.max(...ys);
            const up = ((minDia + maxDia) / 2 - staffRef[staff]) < 4;

            // 加线
            for (let dd = staffRef[staff] - 2; dd >= minDia; dd -= 2) {
              const yy = staffBot[staff] - (dd - staffRef[staff]) * (SP / 2);
              p.push(line(x - 9, yy, x + 9, yy, 1));
            }
            for (let dd = staffRef[staff] + 10; dd <= maxDia; dd += 2) {
              const yy = staffBot[staff] - (dd - staffRef[staff]) * (SP / 2);
              p.push(line(x - 9, yy, x + 9, yy, 1));
            }

            // 相邻二度错开，避免符头叠在一起
            const ordered = ns.slice().sort((a, b) => dia(a) - dia(b));
            const hx = new Map();
            let prevDia = null;
            ordered.forEach(n => {
              const d = dia(n);
              hx.set(n, (prevDia !== null && d - prevDia === 1) ? x + 7.5 : x);
              prevDia = d;
            });

            // 变音记号（同小节同音只标一次）
            let accShift = 0;
            ordered.forEach(n => {
              const pc = n % 12;
              if (IS_BLACK[pc] && accState[n] !== "sharp") {
                p.push(accidental("sharp", hx.get(n) - 14 - accShift, yOf(staff, n)));
                accState[n] = "sharp";
                accShift += 13;
              }
            });

            // 符头
            ordered.forEach(n => p.push(head(hx.get(n), yOf(staff, n), kind)));

            // 符干 / 符尾
            if (kind !== "whole") {
              const span = Math.max(3.5 * SP, (yBot - yTop) + 1.4 * SP);
              const sx = up ? x + 6.2 : x - 6.2;
              if (up) {
                const ty = Math.min(yTop, yBot - span);
                p.push(line(sx, yBot - 0.6, sx, ty, 1.6));
                if (kind === "eighth" || kind === "16th") {
                  p.push(`<path d="M ${sx} ${ty} C ${sx + 7} ${ty + 3.5} ${sx + 8.4} ${ty + 10} ${sx + 3} ${ty + 15}"
                            fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`);
                  if (kind === "16th")
                    p.push(`<path d="M ${sx} ${ty + 7} C ${sx + 7} ${ty + 10.5} ${sx + 8.4} ${ty + 17} ${sx + 3} ${ty + 22}"
                              fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`);
                }
              } else {
                const ty = Math.max(yBot, yTop + span);
                p.push(line(sx, yTop + 0.6, sx, ty, 1.6));
                if (kind === "eighth" || kind === "16th") {
                  p.push(`<path d="M ${sx} ${ty} C ${sx - 7} ${ty - 3.5} ${sx - 8.4} ${ty - 10} ${sx - 3} ${ty - 15}"
                            fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`);
                  if (kind === "16th")
                    p.push(`<path d="M ${sx} ${ty - 7} C ${sx - 7} ${ty - 10.5} ${sx - 8.4} ${ty - 17} ${sx - 3} ${ty - 22}"
                              fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`);
                }
              }
            }
          });
        });
      });

      const lastBar = r.bars[r.bars.length - 1];
      const endX = lastBar.x + lastBar.w;
      p.push(line(endX - 6, trebBot - 4 * SP, endX - 6, trebBot, 1));
      p.push(line(endX - 6, bassBot - 4 * SP, endX - 6, bassBot, 1));
      p.push(line(endX, trebBot - 4 * SP, endX, trebBot, 3));
      p.push(line(endX, bassBot - 4 * SP, endX, bassBot, 3));
    });

    const height = PADT + rows.length * SYS + PADB;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${height}" width="${W}" height="${height}">
      <rect width="${W}" height="${height}" fill="#fbfaf7"/>
      ${p.join("\n")}
    </svg>`;
  }
  /* ==SCORE-END== */

  /* -------------------------------------------------------------------- state */
  const PPQ = 480, GRID = 120;
  const rec = { on: false, start: 0, events: [], held: new Map() };
  let octave = 0;

  const $ = id => document.getElementById(id);
  const statusEl = $("status"), dotEl = $("dot");
  const recBtn = $("recBtn"), playBtn = $("playBtn"), dlBtn = $("dlBtn"), clrBtn = $("clrBtn");
  const quantEl = $("quant"), scoreEl = $("score"), svgBtn = $("svgBtn"), scoreHint = $("scoreHint");

  const bpm = () => Math.max(20, Math.min(400, Number($("bpm").value) || 120));
  const msToTick = ms => Math.round(ms * PPQ * bpm() / 60000);
  const now = () => performance.now();
  const fmtTime = ms => {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };

  function setStatus(txt, live) {
    statusEl.textContent = txt;
    dotEl.classList.toggle("live", !!live);
  }

  function refreshButtons() {
    const n = rec.events.length;
    recBtn.classList.toggle("on", rec.on);
    recBtn.textContent = rec.on ? "■ 停止" : "● 录制";
    $("bpm").disabled = rec.on;
    playBtn.disabled = rec.on || n === 0;
    dlBtn.disabled = rec.on || n === 0;
    clrBtn.disabled = rec.on || n === 0;
    svgBtn.disabled = rec.on || n === 0;
  }

  /* --------------------------------------------------------------- 键盘录入 */
  const KEYMAP = {
    a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11,
    k: 12, o: 13, l: 14, p: 15, ";": 16, "'": 17
  };
  const pressed = new Set();

  function press(midi, vel) {
    if (pressed.has(midi)) return;
    pressed.add(midi);
    startVoice(midi, vel);
    paintKey(midi, true);
    if (rec.on) {
      const tick = msToTick(now() - rec.start);
      rec.events.push({ tick, type: "on", note: midi, vel });
      rec.held.set(midi, tick);
      setStatus("录制中 · " + rec.events.length + " 个事件 · " + fmtTime(now() - rec.start), true);
    }
  }

  function release(midi) {
    if (!pressed.has(midi)) return;
    pressed.delete(midi);
    stopVoice(midi, false);
    paintKey(midi, false);
    if (rec.on && rec.held.has(midi)) {
      rec.events.push({ tick: msToTick(now() - rec.start), type: "off", note: midi });
      rec.held.delete(midi);
      setStatus("录制中 · " + rec.events.length + " 个事件 · " + fmtTime(now() - rec.start), true);
    }
  }

  /* ------------------------------------------------------------------ 琴键 */
  const LOW = 60, HIGH = 84;
  const keyEls = new Map();

  function buildPiano() {
    const keys = $("keys");
    const whites = [];
    for (let m = LOW; m <= HIGH; m++) if (![1, 3, 6, 8, 10].includes(m % 12)) whites.push(m);
    const w = 100 / whites.length;

    whites.forEach((m, i) => {
      const el = document.createElement("div");
      el.className = "wk";
      el.style.left = (i * w) + "%";
      el.style.width = w + "%";
      el.dataset.midi = m;
      const name = ["C", "D", "E", "F", "G", "A", "B"][[0, 2, 4, 5, 7, 9, 11].indexOf(m % 12)];
      el.innerHTML = '<span class="lbl">' + name + (Math.floor(m / 12) - 1) + "</span>";
      keys.appendChild(el);
      keyEls.set(m, el);
    });

    for (let m = LOW; m <= HIGH; m++) {
      if (![1, 3, 6, 8, 10].includes(m % 12)) continue;
      const before = whites.filter(x => x < m).length;
      const el = document.createElement("div");
      el.className = "bk";
      el.style.width = (w * 0.62) + "%";
      el.style.left = ((before * w) - (w * 0.31)) + "%";
      el.dataset.midi = m;
      keys.appendChild(el);
      keyEls.set(m, el);
    }

    let pointerDown = false;
    keys.addEventListener("pointerdown", ev => {
      const el = ev.target.closest("[data-midi]");
      if (!el) return;
      pointerDown = true;
      el.setPointerCapture && el.setPointerCapture(ev.pointerId);
      press(Number(el.dataset.midi), 100);
      ev.preventDefault();
    });
    keys.addEventListener("pointerup", ev => {
      const el = ev.target.closest("[data-midi]");
      if (el) release(Number(el.dataset.midi));
      pointerDown = false;
    });
    keys.addEventListener("pointerleave", ev => {
      const el = ev.target.closest("[data-midi]");
      if (el && pointerDown) release(Number(el.dataset.midi));
    });
    keys.addEventListener("contextmenu", ev => ev.preventDefault());
  }

  function paintKey(midi, down) {
    const el = keyEls.get(midi);
    if (el) el.classList.toggle("down", down);
  }

  function midiForKey(e) {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const off = KEYMAP[k];
    if (off === undefined) return null;
    const m = LOW + octave * 12 + off;
    return m >= LOW && m <= HIGH ? m : null;
  }

  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.tagName === "INPUT") return;

    if (e.code === "Space") { pedal = true; e.preventDefault(); return; }
    if (e.code === "ArrowLeft" || e.key === "z" || e.key === "Z") { shiftOct(-1); return; }
    if (e.code === "ArrowRight" || e.key === "x" || e.key === "X") { shiftOct(1); return; }

    const m = midiForKey(e);
    if (m === null) return;
    e.preventDefault();
    if (e.repeat) return;
    press(m, 100);
  });

  window.addEventListener("keyup", e => {
    if (e.code === "Space") { pedal = false; return; }
    const m = midiForKey(e);
    if (m !== null) release(m);
  });

  window.addEventListener("blur", () => {
    [...pressed].forEach(m => release(m));
    pedal = false;
  });

  function shiftOct(d) {
    const next = Math.max(-2, Math.min(2, octave + d));
    if (next === octave) return;
    octave = next;
    $("oct").textContent = octave > 0 ? "+" + octave : String(octave);
  }

  /* --------------------------------------------------- 事件 → 和弦（可量化） */
  function buildChords(quant) {
    const notes = [];
    const open = new Map();
    rec.events.slice().sort((a, b) => a.tick - b.tick).forEach(e => {
      if (e.type === "on") {
        if (!open.has(e.note)) open.set(e.note, []);
        open.get(e.note).push({ tick: e.tick, vel: e.vel });
      } else {
        const q = open.get(e.note);
        if (q && q.length) {
          const on = q.shift();
          notes.push({ midi: e.note, start: on.tick, end: e.tick, vel: on.vel });
        }
      }
    });
    open.forEach((arr, midi) => arr.forEach(on =>
      notes.push({ midi, start: on.tick, end: on.tick + GRID, vel: on.vel })));
    if (!notes.length) return [];

    const g = quant ? GRID : 1;
    const snapped = notes.map(n => {
      const start = Math.round(n.start / g) * g;
      let dur = Math.round((n.end - n.start) / g) * g;
      dur = quant ? Math.max(GRID, dur) : Math.max(1, dur);
      return { midi: n.midi, start, dur, vel: n.vel };
    });

    const byStart = new Map();
    snapped.forEach(n => {
      if (!byStart.has(n.start)) byStart.set(n.start, { tick: n.start, dur: 0, notes: [] });
      const c = byStart.get(n.start);
      if (!c.notes.includes(n.midi)) c.notes.push(n.midi);
      c.dur = Math.max(c.dur, n.dur);
    });
    return [...byStart.values()]
      .map(c => ({ ...c, notes: c.notes.sort((a, b) => a - b) }))
      .sort((a, b) => a.tick - b.tick);
  }

  /* --------------------------------------------------------------- 谱面渲染 */
  function renderScore() {
    const chords = buildChords(true);
    if (!chords.length) {
      scoreEl.innerHTML = '<div class="empty">还没有音符 —— 按 ● 录制 开始弹奏</div>';
      scoreHint.textContent = "录制后自动生成";
      return;
    }
    scoreEl.innerHTML = scoreSVG(chords, {
      bpm: bpm(), grid: GRID, ppq: PPQ, ticksPerBar: PPQ * 4, width: 1080
    });
    const bars = Math.ceil(Math.max(...chords.map(c => c.tick + c.dur)) / (PPQ * 4));
    scoreHint.textContent = "4/4 · " + bars + " 小节 · 速度 " + bpm();
  }

  /* ---------------------------------------------------------------- 走带控制 */
  const blurAfter = fn => ev => { fn(ev); if (ev.currentTarget.blur) ev.currentTarget.blur(); };

  recBtn.addEventListener("click", blurAfter(() => {
    if (rec.on) { stopRecording(); return; }
    rec.on = true;
    rec.start = now();
    rec.events = [];
    rec.held.clear();
    setStatus("录制中 · 0 个事件 · 0:00", true);
    refreshButtons();
  }));

  function stopRecording() {
    if (!rec.on) return;
    const tick = msToTick(now() - rec.start);
    rec.held.forEach((t, note) => rec.events.push({ tick: Math.max(t, tick), type: "off", note }));
    rec.held.clear();
    rec.on = false;
    setStatus("已录制 · " + rec.events.length + " 个事件 · " + fmtTime(now() - rec.start));
    refreshButtons();
    renderScore();
  }

  let playTimer = null;

  playBtn.addEventListener("click", blurAfter(() => {
    if (playTimer) { stopPlayback(); return; }
    const events = rec.events.slice().sort((a, b) => a.tick - b.tick);
    if (!events.length) return;
    const ms = t => t * 60000 / (PPQ * bpm());
    const t0 = events[0].tick;
    playBtn.textContent = "■ 停止";
    const timers = [];
    events.forEach(e => {
      timers.push(setTimeout(() => {
        if (e.type === "on") { startVoice(e.note, e.vel); paintKey(e.note, true); }
        else { stopVoice(e.note, false); paintKey(e.note, false); }
      }, ms(e.tick - t0)));
    });
    playTimer = { timers };
    timers.push(setTimeout(stopPlayback, ms(events[events.length - 1].tick - t0) + 1200));
    setStatus("试听中…");
  }));

  function stopPlayback() {
    if (!playTimer) return;
    playTimer.timers.forEach(clearTimeout);
    playTimer = null;
    playBtn.textContent = "▶ 试听";
    [...voices.keys()].forEach(m => stopVoice(m, true));
    keyEls.forEach(el => el.classList.remove("down"));
    setStatus(rec.events.length ? "已录制 · " + rec.events.length + " 个事件" : "空闲");
  }

  dlBtn.addEventListener("click", blurAfter(() => {
    let events;
    if (quantEl.checked) {
      events = [];
      buildChords(true).forEach(c => {
        c.notes.forEach(n => {
          events.push({ tick: c.tick, type: "on", note: n, vel: 100 });
          events.push({ tick: c.tick + c.dur, type: "off", note: n });
        });
      });
    } else {
      events = rec.events;
    }
    const bytes = buildMidi(events, bpm(), PPQ);
    const blob = new Blob([bytes], { type: "audio/midi" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "钢琴-" + new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) + ".mid";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    setStatus("已保存 MIDI · " + bytes.length + " 字节");
  }));

  svgBtn.addEventListener("click", blurAfter(() => {
    const chords = buildChords(true);
    if (!chords.length) return;
    const svg = scoreSVG(chords, { bpm: bpm(), grid: GRID, ppq: PPQ, ticksPerBar: PPQ * 4, width: 1080 });
    const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "五线谱-" + new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) + ".svg";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    setStatus("已保存五线谱");
  }));

  clrBtn.addEventListener("click", blurAfter(() => {
    stopPlayback();
    rec.events = [];
    rec.held.clear();
    setStatus("空闲");
    refreshButtons();
    renderScore();
  }));

  quantEl.addEventListener("change", renderScore);
  $("bpm").addEventListener("change", () => { if (!rec.on && rec.events.length) renderScore(); });

  /* -------------------------------------------------------------------- 启动 */
  buildPiano();
  refreshButtons();
  setStatus("空闲");
})();
</script>
</body>
</html>
